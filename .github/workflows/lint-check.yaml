name: Lint and style checks

on:
  pull_request:
    branches:
      main

jobs:
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
    - working-directory: frontend
      run: npm ci
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        working-directory: backend
    - working-directory: backend
      run: |
        uv sync --locked
        make lint-check
  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
    - working-directory: frontend
      run: |
        npm ci
        npm run lint-check
